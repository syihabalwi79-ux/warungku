<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WarungKu - Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">
    <h1>WarungKu</h1>

    <nav>
        <a href="#">Dashboard</a>
        <a href="#">Produk</a>
        <a href="#">Transaksi</a>
    </nav>
</header>


<main class="container">

    <!-- DASHBOARD -->
    <section class="welcome">
        <h2>Dashboard</h2>
        <p>Selamat datang di sistem manajemen WarungKu.</p>
    </section>


    <!-- RINGKASAN -->
    <section class="summary">

        <div class="card">
            <h3>Total Produk</h3>
            <p id="total-products">0</p>
        </div>

        <div class="card">
            <h3>Total Penjualan</h3>
            <p>Rp 0</p>
        </div>

        <div class="card">
            <h3>Transaksi Hari Ini</h3>
            <p>0</p>
        </div>

    </section>


    <!-- TAMBAH PRODUK -->
    <section class="add-product">

        <h2>Tambah Produk</h2>

        <form id="product-form">

            <input
                type="text"
                id="product-name"
                placeholder="Nama produk"
                required
            >

            <select id="product-category" required>
                <option value="">Pilih kategori</option>
            </select>

            <input
                type="number"
                id="product-price"
                placeholder="Harga"
                min="0"
                required
            >

            <input
                type="number"
                id="product-stock"
                placeholder="Stok"
                min="0"
                required
            >

            <button type="submit">
                Tambah Produk
            </button>

        </form>

    </section>


    <!-- KELOLA KATEGORI -->
    <section class="categories">

        <h2>Kelola Kategori</h2>

        <div id="category-list">
            <!-- Daftar kategori akan muncul di sini -->
        </div>


        <h3>Tambah Kategori</h3>

        <form id="category-form">

            <input
                type="text"
                id="category-name"
                placeholder="Nama kategori"
                required
            >

            <button type="submit">
                Tambah Kategori
            </button>

        </form>

    </section>


    <!-- DAFTAR PRODUK -->
    <section class="products">

        <h2>Daftar Produk</h2>

        <div id="product-list"></div>

    </section>

</main>


<script src="js/app.js"></script>

</body>
</html>
